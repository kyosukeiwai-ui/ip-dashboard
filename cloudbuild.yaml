# ==============================================================================
# Cloud Build デプロイパイプライン
# ==============================================================================
steps:
  # 1. Docker イメージのビルドとタグ付け (専用リポジトリを使用)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/ip-dashboard-repo/executive-ip-dashboard:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/ip-dashboard-repo/executive-ip-dashboard:latest'
      - '.'

  # 2. Docker イメージのプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/ip-dashboard-repo/executive-ip-dashboard'
      - '--all-tags'

  # 3. Cloud Run へのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'executive-ip-dashboard'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/ip-dashboard-repo/executive-ip-dashboard:latest'
      - '--region=asia-northeast1'
      - '--project=$PROJECT_ID'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=300'
      # 環境変数・シークレットの注入
      - '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,EPO_CONSUMER_KEY=EPO_CONSUMER_KEY:latest,EPO_CONSUMER_SECRET=EPO_CONSUMER_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,ALLOWED_DOMAINS=ALLOWED_DOMAINS:latest'

# ビルドの監査・ロギング設定
options:
  logging: CLOUD_LOGGING_ONLY
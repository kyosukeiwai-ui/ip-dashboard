# cloudbuild.yaml
# 設計思想: Kanikoのメモリ枯渇(OOM)を回避するため、標準のDockerデーモンを利用します。
# 事前に前回のイメージをPullして --cache-from に指定することで、
# 重厚なMLライブラリのビルド時間を大幅に短縮する堅牢なCI/CDパイプラインです。

steps:
  # Step 1: レジストリから最新のイメージをPullしてキャッシュとして準備する
  # (初回ビルド時など、イメージが存在しない場合はエラーになりますが「|| exit 0」で無視して安全に続行します)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: 
      - '-c'
      - 'docker pull asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/executive-ip-dashboard:latest || exit 0'

  # Step 2: キャッシュを利用してDockerイメージをビルドする (メモリではなくディスクを使用)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/executive-ip-dashboard:latest'
      - '--cache-from'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/executive-ip-dashboard:latest'
      - '.'

  # Step 3: 完成したイメージをArtifact RegistryへPushする
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/executive-ip-dashboard:latest'

  # Step 4: Cloud Runへ最新イメージをデプロイする
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - executive-ip-dashboard
      - --image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/executive-ip-dashboard:latest
      - --region=asia-northeast1
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=1
      - --timeout=300
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,EPO_CONSUMER_KEY=EPO_CONSUMER_KEY:latest,EPO_CONSUMER_SECRET=EPO_CONSUMER_SECRET:latest